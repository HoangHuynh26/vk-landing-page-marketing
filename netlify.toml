[build]
  command = "npm --prefix frontend ci && npm --prefix backend ci && npm --prefix frontend run build"
  publish = "frontend/build"
  functions = "backend/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
